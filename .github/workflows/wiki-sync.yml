name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync-wiki:
    name: Sync Wiki Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync wiki pages
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          REPO_DIR="$GITHUB_WORKSPACE"
          WIKI_DIR="/tmp/wiki"

          # Clonar wiki existente o crear una nueva
          if git clone "$WIKI_URL" "$WIKI_DIR" 2>/dev/null; then
            echo "Wiki cloned successfully"
          else
            echo "Wiki repo not found, initializing..."
            git init "$WIKI_DIR"
            cd "$WIKI_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add origin "$WIKI_URL"
            echo "# Cocodrilo Wiki" > Home.md
            git add -A
            git commit -m "init: create wiki"
            git push -u origin HEAD:master
            echo "Wiki initialized"
          fi

          cd "$WIKI_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Detectar branch de la wiki
          WIKI_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Wiki branch: $WIKI_BRANCH"

          # Limpiar archivos existentes (excepto .git y Home.md)
          find . -maxdepth 1 -name '*.md' ! -name 'Home.md' -delete

          # Copiar paginas desde el repo
          cp "$REPO_DIR"/wiki/*.md ./

          git add -A

          if git diff --cached --quiet; then
            echo "No wiki changes to sync"
          else
            git commit -m "docs: sync wiki from main (${{ github.sha }})"
            git push origin "$WIKI_BRANCH"
            echo "Wiki synced successfully"
          fi
