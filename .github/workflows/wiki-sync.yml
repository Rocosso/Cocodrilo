name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync-wiki:
    name: Sync Wiki Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync wiki pages
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          WIKI_DIR="/tmp/wiki"

          # Clonar wiki existente o crear una nueva
          if git clone "$WIKI_URL" "$WIKI_DIR" 2>/dev/null; then
            echo "Wiki cloned successfully"
          else
            echo "Wiki repo not found, initializing..."
            git init "$WIKI_DIR"
            cd "$WIKI_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add origin "$WIKI_URL"
            echo "# Cocodrilo Wiki" > Home.md
            git add -A
            git commit -m "init: create wiki"
            git push -u origin HEAD:main
            echo "Wiki initialized"
          fi

          cd "$WIKI_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sincronizar archivos .md y .mmd del directorio wiki/
          rsync -a --delete --include='*/' --include='*.md' --include='*.mmd' --exclude='*' ../wiki/ ./

          # Renombrar .mmd a .md para que GitHub wiki los reconozca
          for f in *.mmd; do
            [ -f "$f" ] || continue
            mv "$f" "${f%.mmd}.md"
          done

          git add -A

          if git diff --cached --quiet; then
            echo "No wiki changes to sync"
          else
            git commit -m "docs: sync wiki from main (${{ github.sha }})"
            git push
            echo "Wiki synced successfully"
          fi
